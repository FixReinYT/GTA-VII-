name: Lake City Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Windows template
        run: |
          set -eu
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          unzip -q /tmp/editor.zip -d /tmp/editor
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.zip
          destination="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$destination" build
          unzip -jp /tmp/templates.zip templates/windows_release_x86_64.exe > "$destination/windows_release_x86_64.exe"
          /tmp/editor/Godot* --headless --editor --import
          /tmp/editor/Godot* --headless --export-release "Windows Desktop" build/LakeCity.exe
          test -s build/LakeCity.exe
      - name: Capture menu and mission
        run: xvfb-run -a /tmp/editor/Godot* --audio-driver Dummy --script res://qa/capture.gd
      - uses: actions/upload-artifact@v4
        with:
          name: lake-city
          path: build/
  windows:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lake-city
          path: build
      - name: Boot packaged game and play both endings
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/LakeCity.exe).Path
          $env:APPDATA = "$env:RUNNER_TEMP/lake-city-check"
          foreach ($test in @("boot","campaign")) {
            $logPath = Join-Path $env:RUNNER_TEMP "$test.log"
            $proc = Start-Process $exe -ArgumentList "--headless --log-file `"$logPath`" -- --$test-check" -PassThru
            if (!$proc.WaitForExit(45000)) {
              if (Test-Path $logPath) { Get-Content $logPath }
              $proc.Kill()
              throw "$test check timed out"
            }
            if ($proc.ExitCode -ne 0) { Get-Content $logPath; throw "$test failed" }
          }
          $log = Get-Content (Join-Path $env:RUNNER_TEMP 'campaign.log') -Raw
          Write-Output $log
          $proof = Get-ChildItem $env:APPDATA -Recurse -Filter campaign-passed.txt
          if (!$proof -or $log.Contains('SCRIPT ERROR')) { throw "Campaign failed" }
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "story-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/LakeCity.exe build/Menu.jpg build/City.jpg build/Laundry.jpg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lake City — Последний вызов" --notes "Кулаки, магазины еды, одежды и оружия. Windows x64."
