name: Lake City Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Windows template
        run: |
          set -eu
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          unzip -q /tmp/editor.zip -d /tmp/editor
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.zip
          destination="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$destination" build
          unzip -jp /tmp/templates.zip templates/windows_release_x86_64.exe > "$destination/windows_release_x86_64.exe"
          /tmp/editor/Godot* --headless --editor --import
          /tmp/editor/Godot* --headless --export-release "Windows Desktop" build/LakeCity.exe
          test -s build/LakeCity.exe
      - name: Capture menu and mission
        run: xvfb-run -a /tmp/editor/Godot* --audio-driver Dummy --script res://qa/capture.gd
      - uses: actions/upload-artifact@v4
        with:
          name: lake-city
          path: build/
  windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lake-city
          path: build
      - name: Boot packaged game and play both endings
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/LakeCity.exe).Path
          $intro = Start-Process $exe -ArgumentList '--headless --fixed-fps 60 --quit-after 190 --log-file intro.log' -PassThru -Wait
          if ($intro.ExitCode -ne 0) { throw "Startup failed" }
          $story = Start-Process $exe -ArgumentList '--headless --log-file campaign.log --script res://qa/campaign.gd' -PassThru -Wait
          $log = Get-Content campaign.log -Raw
          Write-Output $log
          if ($story.ExitCode -ne 0 -or ($log -split 'ENDING PASSED').Length -ne 3 -or $log.Contains('SCRIPT ERROR')) { throw "Campaign failed" }
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "story-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/LakeCity.exe build/Menu.jpg build/City.jpg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lake City — Последний вызов" --notes "Короткая кампания. Четыре главы, буксировка, две концовки. Windows x64."
